name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages는 파일을 10분 동안 캐시한다. 새 index.html이 옛 코드와 섞이지 않게 올릴 때마다 코드 폴더 이름에 버전을 붙인다.
      - name: version code paths
        run: |
          v=${GITHUB_SHA::8}
          mv src "src-$v"
          sed -i "s#src=\"src/main.js\"#src=\"src-$v/main.js\"#; s#href=\"style.css\"#href=\"style.css?v=$v\"#" index.html
          grep -q "src-$v/main.js" index.html
          grep -q "style.css?v=$v" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
