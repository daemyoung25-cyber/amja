<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1f33">
<meta name="description" content="바다를 보며 말없이 같이 머무는 암자">
<title>해조암</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="view" aria-label="바닷가 암자"></canvas>

<main id="enter" class="enter">
  <svg class="enter-mark" viewBox="0 0 48 24" aria-hidden="true"><path d="M2 14c9-1 15-5 22-11 7 6 13 10 22 11M8 14v8m32-8v8M2 22h44"/></svg>
  <h1 id="enter-title">해조암</h1>
  <p>바다를 보며 잠깐 머물다 가요</p>
  <button id="enter-btn" type="button">들어가기</button>
</main>

<div id="hud" class="hud" hidden>
  <p id="count" class="count" hidden></p>
  <p id="hint" class="hint" hidden>바닥을 눌러 걷고, 난간을 누르면 기대요</p>
  <p id="whisper" class="whisper" role="status" aria-live="polite"></p>
  <div class="actions">
    <button id="btn-hapjang" type="button">합장</button>
    <button id="btn-bow" type="button" hidden>절</button>
    <button id="btn-sound" type="button" aria-label="소리 설정">소리</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
